# 화면 파일(index.html 등)이나 windows/ 가 바뀌면 Windows용 zip 을 새로 만들어 릴리스에 올림
# 받는 주소: https://github.com/<계정>/holiday-calendar/releases/latest/download/holiday-calendar-windows.zip
name: Windows 다운로드 만들기

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'fonts/**'
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-zip
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # 프로그램 소스가 언제 바뀌었는지 보려고 (아래 '지난 프로그램 쓰기')

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2026-10-26: apt-get update 가 10분 넘게 멈춘 날이 있음 → 기다리는 시간을 정하고, 안 되면 아래 '지난 프로그램 쓰기'로
      - name: 도구 (C# 컴파일러 mono, Pillow)
        id: tools
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python -m pip install --quiet pillow
          A="-o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25"
          sudo apt-get $A update -qq || echo "::warning::apt-get update 실패 — 받아 둔 목록으로 설치해 봄"
          sudo apt-get $A install -y -qq mono-mcs mono-devel > /dev/null

      - name: WebView2 SDK 1.0.3856.49 (pywebview 6.2.1 에 들어 있는 것과 같은 파일)
        run: |
          python -m pip download --quiet --no-deps --only-binary :all: -d dl pywebview==6.2.1
          echo "9d07275f53894ab4d5e2e0e996227193e7187dec276d9b624dccbce029216b46  dl/pywebview-6.2.1-py3-none-any.whl" | sha256sum -c -
          unzip -q dl/pywebview-6.2.1-py3-none-any.whl 'webview/lib/*' -d wv

      - name: 프로그램 만들기
        if: steps.tools.outcome == 'success'
        run: |
          L=wv/webview/lib
          python windows/make_ico.py icons/icon-512.png app.ico
          mcs -sdk:4.8 -target:winexe -platform:anycpu -optimize+ -langversion:6 -codepage:utf8 -warnaserror+ \
            -out:HolidayCalendar.exe -win32icon:app.ico -resource:app.ico,app.ico \
            -r:System.dll -r:System.Drawing.dll -r:System.Windows.Forms.dll \
            -r:$L/Microsoft.Web.WebView2.Core.dll -r:$L/Microsoft.Web.WebView2.WinForms.dll \
            windows/HolidayCalendar.cs

      - name: 지난 프로그램 쓰기 (mono 를 못 받은 날 — 프로그램 소스가 지난 zip 뒤로 안 바뀌었을 때만)
        if: steps.tools.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          SRC=$(git log -1 --format=%ct -- windows/HolidayCalendar.cs windows/make_ico.py icons/icon-512.png)
          REL=$(gh release view windows -R "$R" --json assets --jq '.assets[] | select(.name=="holiday-calendar-windows.zip") | .updatedAt')
          [ -n "$REL" ] || { echo "::error::지난 zip 이 없음 — 나중에 다시 실행"; exit 1; }
          RELT=$(date -d "$REL" +%s)
          echo "프로그램 소스 마지막 변경 $(date -u -d @$SRC) · 지난 zip $REL"
          [ "$SRC" -lt "$RELT" ] || { echo "::error::프로그램 소스가 지난 zip 뒤에 바뀜 — mono 가 필요, 나중에 다시 실행"; exit 1; }
          gh release download windows -p holiday-calendar-windows.zip -D prev -R "$R"
          unzip -q prev/holiday-calendar-windows.zip HolidayCalendar.exe -d prev
          cp prev/HolidayCalendar.exe HolidayCalendar.exe
          echo "::notice::지난 zip 의 HolidayCalendar.exe 를 그대로 씀 (화면 파일만 새것)"

      - name: zip 묶기 (zip 안 이름은 영문만 — 어떤 Windows에서도 탐색기로 풀리게)
        run: |
          L=wv/webview/lib
          D="pkg/HolidayCalendar"
          mkdir -p "$D/app"
          cp HolidayCalendar.exe "$D/HolidayCalendar.exe"
          cp $L/Microsoft.Web.WebView2.Core.dll $L/Microsoft.Web.WebView2.WinForms.dll "$D/"
          for a in win-x64 win-x86 win-arm64; do mkdir -p "$D/runtimes/$a/native"; cp "$L/runtimes/$a/native/WebView2Loader.dll" "$D/runtimes/$a/native/"; done
          cp windows/라이선스.txt "$D/LICENSE.txt"
          W="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          { printf '\xef\xbb\xbf'; sed 's/$/\r/' <<EOF
          휴장 캘린더 — Windows 위젯

          실행: 이 폴더의 HolidayCalendar.exe 를 두 번 클릭
            (처음 실행할 때 'Windows의 PC 보호' 창이 뜨면 → 추가 정보 → 실행)
            app · runtimes 폴더와 dll 파일은 같이 있어야 실행됩니다 (지우지 마세요)

          필요: Windows 10·11 (Microsoft Edge WebView2 런타임 — 보통 이미 깔려 있음)
          휴대폰·맥: $W
          라이선스: LICENSE.txt
          EOF
          } > "$D/README.txt"
          cp index.html data.js sw.js manifest.webmanifest "$D/app/"
          cp -r icons fonts "$D/app/"
          python windows/make_zip.py "$D" holiday-calendar-windows.zip

      - name: 릴리스에 올리기 (늘 같은 주소)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="휴장 캘린더 — Windows 위젯 ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})

          1. holiday-calendar-windows.zip 받기
          2. 압축 풀기 (zip 오른쪽 클릭 → 모두 압축 풀기)
          3. 풀린 폴더의 HolidayCalendar.exe 실행
             (처음 실행할 때 'Windows의 PC 보호' 창이 뜨면 → 추가 정보 → 실행)

          필요: Windows 10·11 (Microsoft Edge WebView2 런타임 — 보통 이미 깔려 있음)
          휴대폰·맥: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          R="$GITHUB_REPOSITORY"
          if gh release view windows -R "$R" > /dev/null 2>&1; then
            gh release upload windows holiday-calendar-windows.zip --clobber -R "$R"
            gh release edit windows --notes "$NOTES" --latest -R "$R"
          else
            gh release create windows holiday-calendar-windows.zip --title "휴장 캘린더 Windows" --notes "$NOTES" --latest -R "$R"
          fi
